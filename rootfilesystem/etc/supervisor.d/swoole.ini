[program:swoole]
command=php /home/ladang/app/artisan octane:start --workers=%(ENV_OCTANE_WORKER)s
user=ladang
autostart=true
autorestart=true
priority=5
startretries=3
stopwaitsecs=10
stdout_events_enabled=true
stderr_events_enabled=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
